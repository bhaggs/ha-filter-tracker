# Names and descriptions live in translations/en.json under "services".
# This file carries only the field shapes and selectors.
set_filter_replaced:
  fields:
    device_id:
      selector:
        device:
          integration: filter_tracker
    entry_id:
      example: 1234567890abcdef
      selector:
        text:
    replacement_datetime:
      selector:
        datetime:

set_usage_time:
  fields:
    device_id:
      selector:
        device:
          integration: filter_tracker
    entry_id:
      example: 1234567890abcdef
      selector:
        text:
    usage_hours:
      example: 150.5
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
          unit_of_measurement: "h"
    adjust_hours:
      example: 10
      selector:
        number:
          step: 0.1
          mode: box
          unit_of_measurement: "h"
