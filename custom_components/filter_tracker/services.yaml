set_filter_replaced:
  name: Set Filter Replaced
  description: Update the install/replacement date for a filter.
  fields:
    device_id:
      name: Device
      description: Target Filter device.
      selector:
        device:
          integration: filter_tracker
    entry_id:
      name: Config Entry
      description: Specific config entry ID to update (alternative to selecting a device).
      example: 1234567890abcdef
    replacement_datetime:
      name: Replacement Date/Time
      description: When the filter was replaced. Defaults to now if omitted.
      selector:
        datetime: {}

set_usage_time:
  name: Set Usage Time
  description: Manually set or adjust the accumulated usage time for a filter.
  fields:
    device_id:
      name: Device
      description: Target Filter device.
      selector:
        device:
          integration: filter_tracker
    entry_id:
      name: Config Entry
      description: Specific config entry ID to update (alternative to selecting a device).
      example: 1234567890abcdef
    usage_hours:
      name: Usage Hours
      description: Set usage time to this specific value in hours.
      example: 150.5
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
          unit_of_measurement: "h"
    adjust_hours:
      name: Adjust Hours
      description: Adjust existing usage time by adding (positive) or subtracting (negative) hours.
      example: 10
      selector:
        number:
          step: 0.1
          mode: box
          unit_of_measurement: "h"
